<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>learning forms</title>
    
    <link rel="stylesheet" href="forms.css">
</head>

<body>
    <h1>we are learning forms today </h1>

    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" minlength="2" maxlength="20"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        <label for="rollno">Roll No:</label>

        <input type="number" id="rollno" name="roll no" placeholder="enter your roll no" min="1" max="100">
        <label for="password">Password:</label>

        <input type="password" id="password" name="password" placeholder="Enter your password" minlength="6" maxlength="20"><br><br>
        <label for="gender">Gender:</label> 

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female" checked>
        <label for="female">Female</label><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>
        
        <label for="color">Choose a color:</label>
        <input type="color" id="color" name="color" value="#ff0000"><br><br>

        <!-- <button type="submit">Submit</button>
        <button type="reset">Reset</button> -->
        <input type="submit" value="Submit your information">
        <input type="reset" value="Reset the form">
    
    </form>
</body>

</html>
